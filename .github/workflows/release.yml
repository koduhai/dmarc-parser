name: Release

# Release-please maintains a "release PR" that bumps the version and CHANGELOG from
# conventional commits. Merging that PR creates the GitHub release + tag, and the
# publish job below then publishes to npm via OIDC trusted publishing (no NPM_TOKEN).
#
# Publishing lives in this same workflow on purpose: a GITHUB_TOKEN-created tag does
# not trigger a separate tag-watching workflow, so a split would never fire.
#
# One-time setup:
#   - npmjs.com: add this repo + workflow `release.yml` (environment `release`) as a
#     Trusted Publisher for @koduhai/dmarc-parser.
#   - GitHub Settings -> Actions -> General: enable "Allow GitHub Actions to create
#     and approve pull requests" so release-please can open its PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# CI never commits, so skip installing the husky git hooks during `npm ci`.
env:
  HUSKY: '0'

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp

  publish:
    name: Publish to npm
    needs: release-please
    # Publishes on a release-please release, or manually via workflow_dispatch
    # (re-publishing the current package.json version, e.g. to recover a failed run).
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      # Node 20 ships npm 10; OIDC trusted publishing needs npm >= 11.5.1. Pinned (not @latest)
      # so the release toolchain is reproducible; Dependabot bumps it.
      - run: npm install -g npm@11.17.0
      - run: npm ci
      # Re-verify the package is sound before publishing anything.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # provenance + public access come from package.json publishConfig.
      - run: npm publish
