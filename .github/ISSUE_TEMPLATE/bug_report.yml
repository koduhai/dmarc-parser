name: Bug report
description: A report does not parse correctly, or the library/CLI misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing for a parsing bug is a
        **minimized, anonymized** sample that reproduces it (scrub real domains and IPs,
        keep the structure). Please do not paste real recipient data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimized, anonymized report sample
      description: The smallest XML/email that reproduces the problem. Scrub real domains/IPs.
      render: xml
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact CLI command or code snippet, and the output or error.
      render: shell
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '@koduhai/dmarc-parser 0.1.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 'node 20.x'
    validations:
      required: true
